# CI for the Eco 5.0 climate app: install, lint, test and build on every
# push and pull request. Deploying happens on Render (render.yaml), because
# GitHub Pages only hosts static files and login needs the Express server.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint   # src, api and shared
      - run: npm test
      - run: npm run build
