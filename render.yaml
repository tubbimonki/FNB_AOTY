# Render Blueprint: one web service that builds the site and runs Express,
# which serves both the site and /api from the same origin.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: fnb-aoty
    runtime: node
    plan: free
    # --include=dev: Vite is a devDependency, and NODE_ENV=production skips those.
    # (.npmrc says the same, so a hand-made service with `npm install` works too.)
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      # Secrets and ids you fill in on the Render dashboard (sync: false = not in git).
      # DATABASE_URL: the Neon connection string. REQUIRED: without it the server
      # stops at start with a message (PGlite needs more RAM than the free plan has).
      - key: DATABASE_URL
        sync: false
      - key: ESKOMSEPUSH_TOKEN
        sync: false
      - key: ESKOMSEPUSH_SCHEDULE
        sync: false
      - key: ESKOMSEPUSH_AREA
        sync: false
      # A ready-made login for judges and demos, made at start if missing.
      - key: DEMO_EMAIL
        sync: false
      - key: DEMO_PASSWORD
        sync: false
